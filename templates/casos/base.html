<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Vargas &amp; Asociados – Gestión de Casos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% url 'casos:lista_casos' %}">
                Vargas &amp; Asociados <span class="text-info">– Gestión de Casos</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navegacionPrincipal" aria-controls="navegacionPrincipal" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navegacionPrincipal">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{% url 'casos:lista_clientes' %}">Clientes</a>
                    <a class="nav-link" href="{% url 'casos:lista_casos' %}">Casos</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container my-4 flex-grow-1">
        {% if messages %}
            <div aria-live="polite" aria-atomic="true">
                {% for message in messages %}
                    <div class="alert {% if 'success' in message.tags %}alert-success{% elif 'error' in message.tags %}alert-danger{% elif 'warning' in message.tags %}alert-warning{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        <div class="container-fluid px-0">
            {% block contenido %}{% endblock %}
        </div>
    </main>

    <footer class="border-top bg-white py-3 mt-auto">
        <div class="container text-center text-secondary">
            <small>&copy; {% now "Y" %} Vargas &amp; Asociados · Gestión de Casos</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
